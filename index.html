<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#151210" />
    <meta name="description" content="Справочник, калькуляторы и инструменты для обувщиков, дизайнеров и колодочников." />
    <title>Cordwainer — Энциклопедия сапожного ремесла</title>
    
    <!-- ========== PWA: Манифест и иконки ========== -->
    <link rel="manifest" href="/manifest.json?v=4" />
    <link rel="icon" type="image/png" href="/icon-192.png?v=4" />
    <link rel="apple-touch-icon" href="/icon-192.png?v=4" />

    <!-- Настройки для полноэкранного режима на iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cordwainer" />
    <!-- ============================================ -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
    
    <!-- Скрипт Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- ========== Принудительная темная тема для браузера ========== -->
    <script>
      (function() {
        try {
          // Проверяем наличие initData, чтобы точно знать, что мы внутри Telegram
          const isTelegram = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData;
          
          if (!isTelegram) {
            // Добавляем класс dark на тег <html>
            document.documentElement.classList.add('dark');
            
            // Если твои стили используют data-theme="dark" вместо класса, 
            // раскомментируй следующую строку:
            // document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {
          console.error('Ошибка инициализации темы:', e);
        }
      })();
    </script>
    <!-- ============================================================= -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
