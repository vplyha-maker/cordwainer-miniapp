<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#151210" />
    <meta
      name="description"
      content="Справочник, калькуляторы и инструменты для обувщиков, дизайнеров и колодочников."
    />
    <title>Cordwainer — Энциклопедия сапожного ремесла</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json?v=4" />
    <link rel="icon" type="image/png" href="/icon-192.png?v=4" />
    <link rel="apple-touch-icon" href="/icon-192.png?v=4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cordwainer" />

    <!-- LCP: hero сразу в HTML -->
    <link
      rel="preload"
      as="image"
      href="/hero-cover.webp"
      type="image/webp"
      fetchpriority="high"
    />

    <!-- Fonts: preconnect + non-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Telegram: defer -->
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>

    <!-- Тёмная тема в браузере до React -->
    <script>
      (function () {
        try {
          var tg = window.Telegram && window.Telegram.WebApp
          var isTelegram = tg && tg.initData && String(tg.initData).trim().length > 0
          if (!isTelegram) {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
