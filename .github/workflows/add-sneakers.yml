name: 👟 Авто-наполнение базы

on:
  workflow_dispatch: 
  schedule:
    # Запуск 4 раза в сутки: каждые 6 часов (в 00:00, 06:00, 12:00 и 18:00 по UTC)
    - cron: '0 */6 * * *' 

jobs:
  run-parser:
    runs-on: ubuntu-latest
    steps:
      - name: Скачиваем репозиторий
        uses: actions/checkout@v3

      - name: Устанавливаем Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Устанавливаем только нужное
        run: npm install pg axios

      - name: Запускаем авто-наполнение
        env:
          NEON_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: node scripts/add-sneakers.js
