name: Photo to 3D Shoe Generator

on:
  workflow_dispatch:
    inputs:
      photo_name:
        description: 'Имя файла фото в репозитории (например, shoe.jpg)'
        required: true
        default: 'shoe.jpg'

jobs:
  convert-2d-to-3d:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyTorch (CPU version) and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Clone TripoSR and install requirements
        run: |
          git clone https://github.com/VAST-AI-Research/TripoSR.git
          cd TripoSR
          pip install -r requirements.txt
          pip install open3d

      - name: Run 3D Generation from Photo on CPU
        run: |
          cd TripoSR
          python run.py ../${{ github.event.inputs.photo_name }} --output-dir ../output_model --device cpu

      - name: Move and Commit generated 3D model
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "bot@github.com"
          mkdir -p public
          cp output_model/0/mesh.obj public/shoe_from_photo.obj
          git add public/shoe_from_photo.obj
          git commit -m "Auto-generated 3D model from photo"
          git push
