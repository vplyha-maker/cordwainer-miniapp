name: 🎨 Аудит базы пигментов

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run spectral pigment audit
        run: node scripts/audit-pigments.mjs public

