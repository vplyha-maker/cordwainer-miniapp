name: scrape-macro

on:
  workflow_dispatch:          # Кнопка ручного запуска
  schedule:
    - cron: '0 3 * * *'       # Каждый день в 03:00 UTC

jobs:
  scrape-macro:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run macro scraper
        run: node src/pages/PricesPage/scripts/macro-sync.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OILPRICE_API_KEY: ${{ secrets.OILPRICE_API_KEY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
